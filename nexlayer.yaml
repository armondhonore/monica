application:
  name: monica
  pods:
  - name: app
    image: monica:4
    path: /
    servicePorts:
    - 80
    vars:
      APP_ENV: production
      APP_KEY: "base64:9zzyoPOviAS90/3CE4HqKmpo6tMjtJHfzRUZ+vuHX+4="
      APP_URL: "https://relaxed-weasel-monica.cloud.nexlayer.ai"
      DB_HOST: monica-mysql.pod
      DB_PORT: "3306"
      DB_DATABASE: monica
      DB_USERNAME: monica
      DB_PASSWORD: monica
    volumes:
    - name: monica-storage
      mountPath: /var/www/html/storage
      size: 10Gi
  - name: mysql
    image: mysql:8
    servicePorts:
    - 3306
    vars:
      MYSQL_DATABASE: monica
      MYSQL_USER: monica
      MYSQL_PASSWORD: monica
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
    - name: monica-db
      mountPath: /var/lib/mysql
      size: 5Gi
